[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "meditate-agent"
version = "0.5.0"
description = "Evidence-grounded semantic analysis and recoverable directive compilation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jeremy McEntire", email = "jandrewmcentire@gmail.com"}]
dependencies = ["anthropic>=0.122,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://jmcentire.github.io/meditate/"
Documentation = "https://jmcentire.github.io/meditate/"
Repository = "https://github.com/jmcentire/meditate"
Issues = "https://github.com/jmcentire/meditate/issues"
Changelog = "https://github.com/jmcentire/meditate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[project.scripts]
meditate = "meditate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meditate"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["meditate"]
